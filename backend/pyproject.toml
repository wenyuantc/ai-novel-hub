[project]
name = "ainovel-backend"
version = "0.1.0"
description = "AI 小说平台后端（FastAPI）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "mcp>=1.2,<2",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# 本地 alembic/ 迁移目录会让 ruff 误判 alembic 为一方包
known-third-party = ["alembic"]
